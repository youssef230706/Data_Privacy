<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Employee Management System</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           background: #12141b; font-family: 'DM Sans', Arial, sans-serif; color: #e4e8f4; }
    .card { background: #1a1d26; border: 1px solid #2e3347; border-radius: 12px; padding: 32px; width: 320px; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    p.sub { color: #8a90a8; font-size: 13px; margin: 0 0 24px; }
    label { display: block; font-size: 12px; color: #a8afc7; margin-bottom: 6px; }
    input { width: 100%; box-sizing: border-box; padding: 10px 12px; margin-bottom: 16px; border-radius: 8px;
            border: 1px solid #2e3347; background: #12141b; color: #e4e8f4; font-size: 14px; }
    input:focus { outline: none; border-color: #5b7cfa; }
    button { width: 100%; padding: 10px; border: 0; border-radius: 8px; background: #5b7cfa; color: #fff;
             font-size: 14px; font-weight: 600; cursor: pointer; }
    button:hover { background: #4a6af0; }
    .error { background: #3a1d22; color: #f25c5c; border-radius: 8px; padding: 8px 12px; font-size: 13px; margin-bottom: 16px; }
  </style>
</head>
<body>
  <form class="card" method="post">
    <h1>Employee Management System</h1>
    <p class="sub">Sign in to continue</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" required autofocus />
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required />
    <button type="submit">Log in</button>
  </form>
</body>
</html>
